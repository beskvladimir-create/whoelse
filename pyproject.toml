[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whoelse"
version = "0.1.0"
description = "Who else is working on what you're working on? An MCP server that finds them, works out what you could build together, and drafts the first message."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vladimir Beskorovainyi" }]
keywords = ["mcp", "research", "collaboration", "openalex", "arxiv", "github", "huggingface", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
whoelse = "whoelse.server:main"

[project.urls]
Homepage = "https://github.com/besk-tech/whoelse"

[tool.hatch.build.targets.wheel]
packages = ["src/whoelse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
